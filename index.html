<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner familial</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3EE;--card:#fff;--ink:#23303F;--mut:#6B7787;--line:#E3DED5;--ok:#2FA66A;--warn:#E8A33D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font-family:inherit;user-select:text}
#app{min-height:100%;display:flex;flex-direction:column;padding:18px 22px 22px;gap:16px}
.top{display:flex;align-items:center;gap:14px}
.top h1{margin:0;font-size:30px;font-weight:900;flex:1}
.top .sub{color:var(--mut);font-weight:700;font-size:18px}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.back{background:#fff;border:2px solid var(--line);border-radius:18px;width:64px;height:64px;font-size:30px}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;flex:1;align-content:center}
.kid{border-radius:32px;padding:28px 20px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 0 rgba(0,0,0,.12);min-height:260px;justify-content:center}
.kid:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.kid .av{font-size:92px;line-height:1}
.kid .nm{font-size:34px;font-weight:900}
.kid .pts{background:rgba(255,255,255,.28);border-radius:999px;padding:6px 18px;font-size:22px;font-weight:900}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 22px;font-size:22px;font-weight:900;display:flex;gap:8px;align-items:center}
.tab.on{color:#fff;border-color:transparent}
.goal{background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px 18px;display:flex;align-items:center;gap:14px}
.bar{height:20px;background:#ECE7DE;border-radius:999px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .5s}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.step{position:relative;background:#fff;border:4px solid var(--line);border-radius:30px;padding:18px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:230px;justify-content:center;transition:.25s}
.step .em{font-size:84px;line-height:1}
.step .lb{font-size:24px;font-weight:900;text-align:center;line-height:1.15}
.step .tm{font-size:17px;font-weight:800;color:var(--mut)}
.step .chk{position:absolute;top:10px;right:10px;width:62px;height:62px;border-radius:50%;border:4px solid var(--line);background:#fff;font-size:34px;color:#fff;display:flex;align-items:center;justify-content:center}
.step.done{background:#EAF7F0;border-color:var(--ok)}
.step.done .em,.step.done .lb{opacity:.45}
.step.done .chk{background:var(--ok);border-color:var(--ok)}
.step.read{border-color:var(--warn);box-shadow:0 0 0 8px rgba(232,163,61,.25)}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 22px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.btn.big{color:#fff;border-color:transparent;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.btn.sm{padding:8px 14px;font-size:17px;border-radius:14px;border-width:2px}
.btn.red{color:#C0392B}
.lock{position:fixed;right:14px;bottom:14px;width:54px;height:54px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:24px;opacity:.55}
.modal{position:fixed;inset:0;background:rgba(35,48,63,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:#fff;border-radius:28px;padding:24px;max-width:96vw;max-height:94vh;overflow:auto}
.pin{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;margin-top:14px}
.pin button{height:76px;font-size:32px;font-weight:900;background:#F1EDE5;border-radius:18px}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0;min-height:22px}
.dots i{width:20px;height:20px;border-radius:50%;background:#D9D3C7}.dots i.f{background:var(--ink)}
.start{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#4C8DF6,#9B7BF2);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:34px;font-weight:900;text-align:center;padding:20px}
.start .big{font-size:110px}
.panel{background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row input,.row select{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;font-weight:700;background:#fff;min-width:0}
.row .e{width:70px;text-align:center;font-size:24px}.row .l{flex:1;min-width:150px}.row .n{width:84px}.row .t{width:130px}
h2{margin:6px 0 10px;font-size:22px}
h3{margin:14px 0 6px;font-size:18px;color:var(--mut)}
.muted{color:var(--mut);font-weight:700}
.rw{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:14px 18px;font-size:24px;font-weight:900}
.rw.sel{border-color:#F2B134;background:#FFF8E6}
.rw .em{font-size:50px}.rw .c{margin-left:auto;font-size:22px}
.timer{position:fixed;left:0;right:0;bottom:0;background:#23303F;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;font-size:24px;font-weight:900;z-index:40}
.timer .bar{background:#44546A;height:28px}.timer .bar>i{background:#F2B134}
.confetti{position:fixed;top:-60px;font-size:44px;z-index:80;pointer-events:none;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.cd{border-radius:28px;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:20px;box-shadow:0 6px 0 rgba(0,0,0,.14);transition:background .6s}
.cdi{font-size:76px;line-height:1}.cdt{flex:1;min-width:0}.cdl{font-size:24px;font-weight:900}.cdn{font-size:64px;font-weight:900;line-height:1.05;margin:2px 0 6px;font-variant-numeric:tabular-nums}.cdx{font-size:20px;font-weight:800;margin-top:8px}
.pbtn{width:62px;height:54px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:12px}.egrid button{font-size:34px;height:58px;background:#F6F3EE;border-radius:14px}
.days{display:flex;gap:4px}.dchip{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);font-weight:900;font-size:16px;background:#fff}.dchip.on{background:#23303F;color:#fff;border-color:#23303F}
.row select{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;font-weight:700;background:#fff}
.modal.top{z-index:130}
.fs{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;color:#fff;background:#2F6FA0;padding:2vh 4vw}
.fs .fsl{font-size:clamp(28px,6vh,64px);font-weight:900}
.fsr{position:relative;width:min(68vh,86vw);height:min(68vh,86vw)}
.fsr svg{width:100%;height:100%}.fsn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(20vh,24vw);font-weight:900;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:3px solid var(--line);border-radius:16px;padding:10px 16px;font-size:20px;font-weight:900;background:#fff}.chip.on{background:#23303F;color:#fff;border-color:#23303F}
.cmd{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.cmd input{flex:1;min-width:200px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700}
.cmdmsg{font-weight:800;color:#1F7A4D;margin:-4px 0 10px;min-height:22px}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:95;background:#fff;border:4px solid #F2B134;border-radius:28px;padding:18px 30px;font-size:clamp(26px,5vw,44px);font-weight:900;color:#23303F;box-shadow:0 10px 0 rgba(0,0,0,.12);animation:toast 2.2s ease forwards;pointer-events:none;text-align:center;max-width:92vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,24px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}22%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.fstar{position:fixed;left:0;top:0;z-index:96;font-size:44px;line-height:1;pointer-events:none;will-change:transform}
.rw.read,.step.read{border-color:#E8A33D;box-shadow:0 0 0 8px rgba(232,163,61,.25)}
.rw .ds{font-size:19px;font-weight:700;color:var(--mut);margin-top:2px}
.stt{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:#C0392B}
.step .bar.sm{height:12px;width:80%}.step.over{border-color:#D9534F}
button.pill{font-family:inherit;color:inherit}
.egrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;flex:1}
.emo{border-radius:34px;color:#fff;padding:20px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:210px;box-shadow:0 8px 0 rgba(0,0,0,.14);border:6px solid transparent}
.emo.on{border-color:#fff;outline:6px solid #23303F}.emo .em{font-size:92px;line-height:1}.emo .lb{font-size:28px;font-weight:900;text-align:center}
.breath{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.bc{width:min(42vh,64vw);aspect-ratio:200/270;transform:scale(.45);transform-origin:50% 66%;transition:transform 4s ease-in-out}.bc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.bt{font-size:clamp(34px,7vh,60px);font-weight:900}
.alertb{background:#FDECEA;border:3px solid #E5534B;border-radius:22px;padding:14px 20px;font-size:22px;font-weight:900;text-align:left;color:#8A1F17}
.gcard{background:#fff;border:4px solid var(--line);border-radius:36px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.gcard .em{font-size:min(24vh,38vw);line-height:1}.gcard .gt{font-size:clamp(28px,5.5vh,48px);font-weight:900;line-height:1.2}
@keyframes look{0%,100%{transform:translateX(0)}25%{transform:translateX(-14%)}75%{transform:translateX(14%)}}
@keyframes tapA{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(1.18) rotate(-7deg)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes sniff{0%,100%{transform:scale(1)}30%{transform:scale(1.14)}60%{transform:scale(.96)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes squeeze{0%,100%{transform:scale(1)}20%,65%{transform:scale(.6)}85%{transform:scale(1.05)}}
@keyframes shoulders{0%,100%{transform:translateY(0)}30%,60%{transform:translateY(-16%)}}
@keyframes relax{0%,100%{transform:scale(1.04)}50%{transform:scale(.96)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9%)}}
.an-look{animation:look 2.6s ease-in-out infinite}.an-tapA{animation:tapA 1.4s ease-in-out infinite}.an-wig{animation:wig 1.8s ease-in-out infinite}.an-sniff{animation:sniff 2s ease-in-out infinite}.an-beat{animation:beat 1.3s ease-in-out infinite}.an-squeeze{animation:squeeze 4s ease-in-out infinite}.an-shoulders{animation:shoulders 3.5s ease-in-out infinite}.an-relax{animation:relax 4s ease-in-out infinite}.an-floaty{animation:floaty 3s ease-in-out infinite}
.gcard .em,.rw .em{display:inline-block}
.vbtn{right:78px}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4C8DF6"><meta name="mobile-web-app-capable" content="yes"></head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
(function(){
'use strict';
const KEY='fp_v1';
const uid=()=>Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S=(l,e,t,p)=>({id:uid(),label:l,emoji:e,time:t||'',pts:p||1});
function defaults(){
  const lou=[
    {id:uid(),name:'Matin',emoji:'🌅',from:5,bonus:3,steps:[S('Me lever','🛏️'),S('Aller à la toilette','🚽'),S('Déjeuner','🥣'),S('Me brosser les dents','🪥'),S("M'habiller",'👕'),S('Mettre mes souliers','👟'),S('Prendre mon sac','🎒')]},
    {id:uid(),name:'Après l’école',emoji:'🏠',from:11,bonus:3,steps:[S('Enlever mes souliers','👟'),S('Ranger mon sac','🎒'),S('Collation','🍎'),S('Devoirs','✏️'),S('Jouer','🧸')]},
    {id:uid(),name:'Dodo',emoji:'🌙',from:17,bonus:3,steps:[S('Mettre mon pyjama','👚'),S('Aller à la toilette','🚽'),S('Me brosser les dents','🪥'),S('Lire une histoire','📖'),S('Dormir','😴')]}
  ];
  const mini=()=>[
    {id:uid(),name:'Matin',emoji:'🌅',from:5,bonus:3,steps:[S('Déjeuner','🥣'),S('Brosser les dents','🪥'),S("M'habiller",'👕'),S('Mettre mes souliers','👟')]},
    {id:uid(),name:'Après l’école',emoji:'🏠',from:11,bonus:3,steps:[S('Collation','🍎'),S('Jouer','🧸')]},
    {id:uid(),name:'Dodo',emoji:'🌙',from:17,bonus:3,steps:[S('Mettre mon pyjama','👚'),S('Brosser les dents','🪥'),S('Lire une histoire','📖'),S('Dormir','😴')]}
  ];
  const beh=()=>[{id:uid(),label:'Demander calmement',emoji:'🗣️',pts:2},{id:uid(),label:'Attendre mon tour',emoji:'⏳',pts:2},{id:uid(),label:'Aider quelqu’un',emoji:'🤝',pts:2},{id:uid(),label:'Rester calme',emoji:'😌',pts:3}];
  return {v:1,date:today(),pin:'1234',voiceName:'',rate:0.9,done:{},bonusDone:{},
    kids:[
      {id:'lc',name:'Louis-Charles',emoji:'🦊',color:'#4C8DF6',points:0,goal:null,routines:lou,behaviors:beh()},
      {id:'li',name:'Livia',emoji:'🌸',color:'#F27BA8',points:0,goal:null,routines:mini(),behaviors:[]},
      {id:'la',name:'Laura',emoji:'🦋',color:'#9B7BF2',points:0,goal:null,routines:mini(),behaviors:[]}],
    rewards:[{id:uid(),label:'30 min de tablette',emoji:'📱',cost:20},{id:uid(),label:'Choisir le souper',emoji:'🍕',cost:50},{id:uid(),label:'Soirée cinéma',emoji:'🎬',cost:80},{id:uid(),label:'Sortie au parc',emoji:'🛝',cost:100}]};
}
let state;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}try{syncDirty()}catch(e){}}
state=load()||defaults();
function rollDay(){if(state.date!==today()){state.date=today();state.done={};state.bonusDone={};state.stepTimers={};save()}}
if(!state.stepTimers)state.stepTimers={};
if(!state.emoLog)state.emoLog=[];
if(!state.emotions)state.emotions=[
 {id:'joy',emoji:'😄',label:'content',color:'#E8B923',say:'{n}, tu es content. C’est bien de se sentir content.',alert:false,calm:false},
 {id:'calm',emoji:'😌',label:'calme',color:'#4FAE6E',say:'{n}, tu es calme. C’est très bien.',alert:false,calm:false},
 {id:'sad',emoji:'😢',label:'triste',color:'#5B8DEF',say:'{n}, tu es triste. C’est correct d’être triste. Tu peux demander un câlin.',alert:false,calm:true},
 {id:'worry',emoji:'😟',label:'inquiet',color:'#EE8E3C',say:'{n}, tu es inquiet. C’est correct. Tu n’es pas seul.',alert:false,calm:true},
 {id:'angry',emoji:'😠',label:'en colère',color:'#E5534B',say:'{n}, tu es en colère. C’est correct d’être en colère. Tu peux respirer avec moi.',alert:true,calm:true},
 {id:'help',emoji:'😣',label:'j’ai besoin d’aide',color:'#8A4FB0',say:'{n}, tu as besoin d’aide. Respirons ensemble.',alert:true,calm:true}];
if(state.calm)state.calm.forEach(c=>{if(!c.anim)c.anim={c1:'squeeze',c2:'tapA',c4:'beat'}[c.id]||'floaty'});
if(!state.calm)state.calm=[
 {id:'c1',emoji:'🧸',label:'Mon jouet sensoriel',desc:'Va chercher ton jouet sensoriel et serre-le doucement.'},
 {id:'c2',emoji:'💧',label:'Boire de l’eau',desc:'Prends un verre d’eau et bois lentement.'},
 {id:'c3',emoji:'🛋️',label:'Le coin calme',desc:'Va t’asseoir dans ton coin calme.'},
 {id:'c4',emoji:'🤗',label:'Demander un câlin',desc:'Tu peux demander un câlin à un parent.'}];
state.calm.forEach(c=>{if(!c.anim)c.anim={c1:'squeeze',c2:'tapA',c4:'beat'}[c.id]||'floaty'});
state.kids.forEach(k=>k.routines.forEach(r=>{if(r.chain===undefined)r.chain=true}));
if(!state.events)state.events=[{id:uid(),label:'On part pour l’école',emoji:'🚌',time:'07:45',days:[1,2,3,4,5]}];
rollDay();

const ui={sTok:0,readTok:0,toolId:null,fsTimer:null,fsChoose:null,pinFor:null,cmdMsg:'',picker:null,confirmDel:null,cdKey:'',prevScreen:'home',screen:'home',kidId:null,routineId:null,tab:'points',editKid:null,editRoutine:null,sound:false,reading:null,pin:'',timer:null,confirmReset:false,shopFor:null};
const kid=id=>state.kids.find(k=>k.id===id);
const curKid=()=>kid(ui.kidId);
function pickRoutine(k){const h=new Date().getHours();let r=k.routines[0];k.routines.forEach(x=>{if(x.from<=h)r=x});return r}

/* ---------- sound & voice ---------- */
let actx=null,voices=[];
function loadVoices(){try{voices=window.speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function beep(seq){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.8})}catch(e){}}
const sndStep=()=>beep([[660,.12],[880,.16]]);
const sndWin=()=>beep([[523,.14],[659,.14],[784,.14],[1047,.4]]);
function stopSpeech(){ui.readTok++;ui.sTok++;ui.reading=null;try{window.speechSynthesis.cancel()}catch(e){}try{if(window.fully&&fully.stopTextToSpeech)fully.stopTextToSpeech()}catch(e){}}
function voiceOn(){return ui.sound&&state.voiceOn!==false}
function speak(text,cb){
  const tok=++ui.sTok;let fired=false;const fin=()=>{if(fired)return;fired=true;if(tok===ui.sTok&&cb)cb()};
  if(!voiceOn()){try{window.speechSynthesis.cancel()}catch(e){}cb&&setTimeout(fin,600);return}
  if(window.fully&&typeof fully.textToSpeech==='function'){try{try{fully.stopTextToSpeech&&fully.stopTextToSpeech()}catch(e){}try{fully.textToSpeech(text,'fr-CA')}catch(e){fully.textToSpeech(text)}}catch(e){}if(cb)setTimeout(fin,900+text.length*85);return}
  try{const s=window.speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-CA';
    const v=(state.voiceURI&&voices.find(v=>v.voiceURI===state.voiceURI))||voices.find(v=>/fr[-_]CA/i.test(v.lang))||voices.find(v=>/^fr/i.test(v.lang));if(v){u.voice=v;u.lang=v.lang}
    u.rate=state.rate||0.9;u.pitch=state.pitch||1;u.onend=fin;u.onerror=fin;s.speak(u);if(cb)setTimeout(fin,5000+text.length*110)}catch(e){cb&&setTimeout(fin,600)}
}

function nextEvent(){
  const n=new Date(),dow=n.getDay(),nowSec=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();let best=null;
  state.events.forEach(ev=>{if(!ev.time||!(ev.days||[]).includes(dow))return;const p=ev.time.split(':');const left=(+p[0]*3600+(+p[1])*60)-nowSec;

}

/* parent voice / typed commands (rule-based, French) */
const NUMW={zero:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16,vingt:20,trente:30,quarante:40,cinquante:50,soixante:60};
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,' ').replace(/\s+/g,' ').trim()}
function numify(s){
  s=s.replace(/\b(vingt|trente|quarante|cinquante)[\s-]+(?:et[\s-]+)?(un|une|deux|trois|quatre|cinq|six|sept|huit|neuf)\b/g,(m,a,b)=>NUMW[a]+NUMW[b]);
  return s.replace(/\b(zero|une?|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|treize|quatorze|quinze|seize|vingt|trente|quarante|cinquante|soixante)\b/g,m=>NUMW[m]);
}
function parseTime(t){
  const m=t.match(/\b(\d{1,2})\s*(?:h|heures?|:)\s*(?:et\s+)?(\d{2}|demie?|quart)?/);if(!m)return null;
  const hh=+m[1];let mm=0;if(m[2]){mm=/^\d/.test(m[2])?+m[2]:/^demi/.test(m[2])?30:15}
  if(hh>23||mm>59)return null;return pad(hh)+':'+pad(mm);
}
const STOP=new Set(['change','changer','mets','met','modifie','deplace','decale','remplace','heure','rappel','pour','dans','etape','routine','de','du','des','la','le','les','a','au','aux','et','on','en']);
function toks(s){return norm(s).split(' ').filter(w=>w.length>=4&&!STOP.has(w))}
function findKid(s){const n=norm(s);return state.kids.find(k=>n.includes(norm(k.name)))||state.kids.find(k=>norm(k.name).split(/[\s-]/).some(w=>w.length>2&&n.includes(w)))}
function execCmd(raw){
  const t=numify(norm(raw));if(!t)return 'Rien entendu.';
  let m;
  if(/(minuterie|timer|chrono|retrait)/.test(t)&&(m=t.match(/(\d+(?:[.,]\d+)?)\s*(secondes?|sec|minutes?|min)?/))){
    let v=parseFloat(m[1].replace(',','.'));if(m[2]&&/^sec/.test(m[2]))v=v/60;
    const label=/retrait/.test(t)?'Retrait':'Minuterie';startFs(v,label);return label+' de '+m[1]+(m[2]&&/^sec/.test(m[2])?' secondes':' minutes')+' démarrée.';
  }
  if((m=t.match(/\b(ajoute|rajoute)\s+(\d+)\s+minutes?/))){const id=Object.keys(state.stepTimers)[0];if(id&&addTime(id,+m[2]))return m[2]+' minutes ajoutées à l’étape en cours.';return 'Aucune étape en cours.'}
  m=t.match(/\b(ajoute|donne|enleve|retire)\s+(\d+)\s+points?\s+(?:a|au|aux)?\s*(.+)/);
  if(m){const k=findKid(m[3]);if(!k)return 'Quel enfant ? Je n’ai pas reconnu le prénom.';const n=+m[2]*(/^(enleve|retire)/.test(m[1])?-1:1);addPts(k,n);return (n>0?'+':'')+n+' point'+(Math.abs(n)>1?'s':'')+' pour '+k.name+' (total '+k.points+').'}
  const tm=parseTime(t);
  if(tm&&/(change|mets?|modifie|deplace|decale|remplace|heure|rappel)/.test(t)){
    const kidHit=findKid(t),words=toks(t);let best=null,score=0;
    state.events.forEach(ev=>{let s=toks(ev.label).filter(w=>words.includes(w)).length;if(/depart/.test(t)&&/(depart|part)/.test(norm(ev.label)))s+=2;if(s>score){score=s;best={ev}}});
    state.kids.forEach(k=>{if(kidHit&&k!==kidHit)return;k.routines.forEach(r=>r.steps.forEach(st=>{const s=toks(st.label).filter(w=>words.includes(w)).length;if(s>score){score=s;best={st,k}}}))});
    if(!best)return 'Je n’ai pas trouvé quoi modifier. Essaie : « Change l’heure du départ à 7 h 30 ».';
    if(best.ev){best.ev.time=tm;save();return '« '+best.ev.label+' » : '+tm.replace(':',' h ')+'.'}
    best.st.time=tm;save();return 'Rappel « '+best.st.label+' » ('+best.k.name+') : '+tm.replace(':',' h ')+'.';
  }
  return 'Pas compris. Exemples : « Minuterie 10 minutes », « Ajoute 3 points à Livia », « Change l’heure du départ à 7 h 30 ».';
}

  const set=(txt,sc,dur,n)=>{const b=document.getElementById('bc'),t=document.getElementById('bt'),nn=document.getElementById('bn');if(!b)return;b.style.transitionDuration=dur+'s';b.style.transform='scale('+sc+') translateY('+(sc>.9?'-3%':'0')+')';t.textContent=txt;if(nn&&n!==undefined)nn.textContent=n};

function fly(from,old,k,msg){
  showToast(msg);speak(msg);
  const pill=document.getElementById('ptsPill'),fill=document.getElementById('goalFill'),gt=document.getElementById('goalTxt'),bar=document.getElementById('goalbar');
  const rw=state.rewards.find(x=>x.id===k.goal);

  const target=(rw&&bar)?bar:pill;
  if(!from||!target||!document.body.animate){setVals(k.points);return}
  setVals(old);
  const tr=target.getBoundingClientRect();
  const x0=from.left+from.width/2,y0=from.top+from.height/2;
  const frac=(rw&&bar)?Math.min(1,old/rw.cost+0.02):0.5;
  const x1=tr.left+tr.width*(rw&&bar?Math.max(.04,Math.min(.98,Math.min(100,Math.round(k.points/rw.cost*100))/100)):0.5),y1=tr.top+tr.height/2;
  const n=Math.max(1,Math.min(6,k.points-old));let finished=0;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='fstar';el.textContent='⭐';document.body.appendChild(el);
    const xm=(x0+x1)/2+(Math.random()-.5)*120,ym=Math.min(y0,y1)-60-Math.random()*80,off=-22;

      {transform:`translate(${x0+off}px,${y0+off}px) scale(.5)`,opacity:1},
      {transform:`translate(${xm+off}px,${ym+off}px) scale(1.7)`,opacity:1,offset:.45},
      {transform:`translate(${x1+off}px,${y1+off}px) scale(.7)`,opacity:.95}],
      {duration:950,delay:i*140,easing:'cubic-bezier(.35,.1,.3,1)',fill:'forwards'});
    a.onfinish=()=>{el.remove();beep([[880+i*90,.07]]);finished++;
      setVals(Math.min(k.points,old+Math.ceil((k.points-old)*finished/n)));
      target.classList.remove('pop');void target.offsetWidth;target.classList.add('pop');

  }
}

  ids.forEach(id=>{
    const t=state.stepTimers[id],k=kid(t.k);if(!k){delete state.stepTimers[id];return}
    let s=null;k.routines.forEach(r=>r.steps.forEach(x=>{if(x.id===id)s=x}));if(!s||state.done[id]){delete state.stepTimers[id];needRender=true;return}
    const left=t.end-Date.now(),ls=left/1000;t.w=t.w||{};
    [5,2,1].forEach(m=>{if(ls<=m*60&&ls>0&&m*60<t.total/1000&&!t.w[m]){t.w[m]=true;save();speak(k.name+', il reste '+m+' minute'+(m>1?'s':'')+' pour '+s.label+'.')}});
    if(left<=0&&!t.exp){t.exp=true;save();sndStep();speak(k.name+', le temps est écoulé pour '+s.label+'.');needRender=true}
    const pct=Math.max(0,Math.min(100,left/t.total*100)),txt=left<=0?'Temps écoulé':fsFmt(left);
    [['stt-'+id,txt],['runn',txt]].forEach(([i,v])=>{const e=document.getElementById(i);if(e)e.textContent=v});
    [['stb-'+id],['runb']].forEach(([i])=>{const e=document.getElementById(i);if(e)e.style.width=pct+'%'});
    const run=document.getElementById('run');if(run)run.style.background=cdColor(ls);
  });
  if(needRender&&(ui.screen==='kid'||ui.screen==='home'))render();
}
/* ---------- live countdown + spoken reminders (neutral voice) ---------- */
const said={};
setInterval(function(){
  stepTick();
  const dt=document.getElementById('dt');if(dt)dt.textContent=dateStr()+' · '+timeStr();
  const b=nextEvent(),key=b?b.ev.id:'';
  if((ui.screen==='home'||ui.screen==='kid')&&key!==(ui.cdKey||'')){render();return}
  if(b){const n=document.getElementById('cdn'),bar=document.getElementById('cdb'),cd=document.getElementById('cd');
    if(n)n.textContent=fmtLeft(b.left);if(bar)bar.style.width=Math.max(0,Math.min(100,b.left/3600*100))+'%';if(cd)cd.style.background=cdColor(b.left)}
},1000);
setInterval(function(){
  rollDay();
  const n=new Date(),now=pad(n.getHours())+':'+pad(n.getMinutes());
  const at=m=>{const x=new Date(n.getTime()+m*60000);return pad(x.getHours())+':'+pad(x.getMinutes())};
  state.kids.forEach(k=>k.routines.forEach(r=>r.steps.forEach(s=>{
    if(!s.time||state.done[s.id])return;
    const k5=today()+s.id+'5',k0=today()+s.id+'0';
    if(s.time===at(5)&&!said[k5]){said[k5]=1;if(ui.sound)speak(k.name+', dans 5 minutes : '+s.label+'.')}
    if(s.time===now&&!said[k0]){said[k0]=1;if(s.dur&&!state.stepTimers[s.id]){if(ui.sound)startStepTimer(k,s)}else if(ui.sound){sndStep();speak(k.name+', c’est l’heure : '+s.label+'.')}}
  })));
  state.events.forEach(ev=>{
    if(!ev.time||!(ev.days||[]).includes(n.getDay()))return;
    [15,10,5,1].forEach(m=>{const kk=today()+ev.id+'m'+m;if(ev.time===at(m)&&!said[kk]){said[kk]=1;if(ui.sound)speak('Dans '+m+' minute'+(m>1?'s':'')+' : '+ev.label+'.')}});
    const k0=today()+ev.id+'m0';if(ev.time===now&&!said[k0]){said[k0]=1;if(ui.sound){sndWin();speak('C’est l’heure : '+ev.label+'.')}}
  });
},15000);

/* ---------- synchronisation (Supabase, RPC) ---------- */
var SKEY='fp_sync',LOCAL_KEYS=['voiceURI','voiceOn','rate','pitch','voiceName'];
var sync;try{sync=JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){sync={}}
ui.syncMsg='';ui.syncDraft={url:sync.url||'',key:sync.key||'',code:sync.code||''};
var syncLast='',syncT=null,syncBusy=false,syncApplying=false,renderPending=false;
function syncOnFlag(){return !!(sync&&sync.url&&sync.key&&sync.code)}
async function rpc(fn,args){const h={'apikey':sync.key,'Content-Type':'application/json'};if(/^eyJ/.test(sync.key))h.Authorization='Bearer '+sync.key;
  const r=await fetch(sync.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});if(!r.ok)throw new Error('http '+r.status);const t=await r.text();return t?JSON.parse(t):null}
function payload(){const o={};Object.keys(state).forEach(k=>{if(LOCAL_KEYS.indexOf(k)<0&&k!=='_ts')o[k]=state[k]});return o}
function hash(){return JSON.stringify(payload())}
function setSyncMsg(m){ui.syncMsg=m;const el=document.getElementById('syncMsg');if(el)el.textContent=m}
function toArr(x){return Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[])}
function fixState(){['done','bonusDone','stepTimers'].forEach(k=>{if(!state[k]||typeof state[k]!=='object')state[k]={}});
  ['emoLog','events','calm','emotions','rewards','kids'].forEach(k=>state[k]=toArr(state[k]));
  state.events.forEach(ev=>ev.days=toArr(ev.days));
  state.kids.forEach(k=>{k.behaviors=toArr(k.behaviors);k.routines=toArr(k.routines);k.routines.forEach(r=>r.steps=toArr(r.steps));if(k.goal===undefined)k.goal=null})}
function syncDirty(){if(!syncOnFlag()||syncApplying)return;if(hash()===syncLast)return;clearTimeout(syncT);syncT=setTimeout(syncPush,900)}
async function syncPush(){if(!syncOnFlag())return;const h=hash();state._ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  try{await rpc('planner_put',{c:sync.code,d:payload(),t:state._ts});syncLast=h;setSyncMsg('✓ Synchronisé à '+new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}))}
  catch(e){setSyncMsg('⚠ Pas de connexion ou accès refusé — nouvel essai…');clearTimeout(syncT);syncT=setTimeout(syncPush,8000)}}
function softRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){renderPending=true;return}renderPending=false;render()}
function applyRemote(d){if(!d||typeof d!=='object')return;const keep={};LOCAL_KEYS.forEach(k=>{if(k in state)keep[k]=state[k]});
  Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,d,keep);fixState();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}syncLast=hash();softRender()}
async function syncPull(){if(!syncOnFlag()||syncBusy)return;syncBusy=true;
  try{const ts=await rpc('planner_ts',{c:sync.code});
    if(ts===null){await syncPush()}
    else if(ts>(state._ts||0)){const d=await rpc('planner_get',{c:sync.code});if(d)d._ts=ts;applyRemote(d);setSyncMsg('✓ Mis à jour à '+new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'}))}
    else if(ts<(state._ts||0)||hash()!==syncLast){await syncPush()}
    else setSyncMsg('✓ Synchronisé')}
  catch(e){setSyncMsg('⚠ Pas de connexion ou accès refusé')}
  finally{syncBusy=false;if(renderPending)softRender()}}
syncLast=hash();
setInterval(syncPull,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPull()});
syncPull();

render();
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
